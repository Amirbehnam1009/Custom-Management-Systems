{% extends "base.html" %}
{% block title %}مدیریت کوتاژها{% endblock %}
{% block heading %}مدیریت کوتاژها{% endblock %}
{% block content %}
<div class="page-head">
  <h2>کوتاژها</h2>
  <a class="btn btn-gold" href="{{ url_for('declaration_new_page') }}">ثبت کوتاژ جدید</a>
</div>
<div class="card">
  <div class="filters">
    <div><label>شرکت</label><select id="company_id"><option value="">همه</option>{% for c in all_companies %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div>
    <div><label>جستجو (کوتاژ / حواله / قرارداد)</label><input id="q"></div>
    <div><label>وضعیت</label><select id="status"><option value="">همه</option>{% for s in statuses %}<option value="{{ s }}">{{ s }}</option>{% endfor %}</select></div>
  </div>
  <button class="btn btn-primary" id="apply">جستجو</button>
  <div class="table-wrap" style="margin-top:14px">
    <table>
      <thead>
        <tr><th>شرکت</th><th>شماره قرارداد</th><th>شماره کوتاژ</th><th>تناژ</th><th>برای شخص</th><th>وضعیت</th><th>شماره حواله</th><th>عملیات</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function loadDecls() {
  const params = new URLSearchParams();
  ['company_id','q','status'].forEach(id => { const v = document.getElementById(id).value; if (v) params.set(id, v); });
  const data = await api('/api/declarations?' + params.toString());
  document.getElementById('rows').innerHTML = data.items.map(d => `
    <tr>
      <td>${escapeHtml(d.company_name)}</td>
      <td><a href="/contracts/${d.contract_id}">${escapeHtml(d.contract_number)}</a></td>
      <td>${escapeHtml(d.declaration_number)}</td>
      <td>${formatNumber(d.tonnage)}</td>
      <td>${escapeHtml(d.recipient || '-')}</td>
      <td>${escapeHtml(d.status)}</td>
      <td>${escapeHtml(d.dispatch_reference_number || '-')}</td>
      <td><a class="btn btn-sm btn-ghost" href="/declarations/${d.id}/edit">ویرایش</a></td>
    </tr>
  `).join('') || '<tr><td colspan="8">کوتاژی یافت نشد</td></tr>';
}
document.getElementById('apply').onclick = loadDecls;
loadDecls();
</script>
{% endblock %}
