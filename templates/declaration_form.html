{% extends "base.html" %}
{% block title %}{{ 'ویرایش کوتاژ' if declaration else 'ثبت کوتاژ جدید' }}{% endblock %}
{% block heading %}{{ 'ویرایش کوتاژ' if declaration else 'ثبت کوتاژ جدید' }}{% endblock %}
{% block content %}
<div class="card">
  <form id="form" class="form-grid">
    <div class="full">
      <label>قرارداد</label>
      <select name="contract_id" id="contract_id" required></select>
    </div>
    <div>
      <label>شماره کوتاژ</label>
      <input name="declaration_number" required value="{{ declaration.declaration_number if declaration else '' }}">
    </div>
    <div>
      <label>تناژ</label>
      <input name="tonnage" required value="{{ declaration.tonnage if declaration else '' }}">
    </div>
    <div>
      <label>برای شخص</label>
      <input name="recipient" value="{{ declaration.recipient if declaration else '' }}">
    </div>
    <div>
      <label>شماره حواله</label>
      <input name="dispatch_reference_number" value="{{ declaration.dispatch_reference_number if declaration else '' }}">
    </div>
    <div>
      <label>وضعیت</label>
      <select name="status">
        {% for s in statuses %}
        <option value="{{ s }}" {% if declaration and declaration.status == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="full">
      <label>توضیحات</label>
      <textarea name="description">{{ declaration.description if declaration else '' }}</textarea>
    </div>
    <div class="full">
      <label><input type="checkbox" name="allow_over_declaration" value="1"> در صورت نیاز، مجوز تنظیم تناژ بیش از مانده قرارداد</label>
    </div>
    <div class="full actions">
      <button class="btn btn-primary" type="submit">ذخیره کوتاژ</button>
      <a class="btn btn-ghost" href="{{ url_for('declarations_page') }}">بازگشت</a>
    </div>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
const preselected = {{ preselected_contract.id if preselected_contract else 'null' }};
async function loadContracts() {
  const data = await api('/api/contracts');
  if (!data.ok) { alert(data.error || 'خطا در بارگذاری قراردادها'); return; }
  const sel = document.getElementById('contract_id');
  sel.innerHTML = (data.items || []).map(c => `<option value="${c.id}" ${preselected === c.id ? 'selected' : ''}>${escapeHtml(c.company_name)} | ${escapeHtml(c.contract_number)} | مانده ${formatNumber(c.remaining_tonnage)}</option>`).join('');
}
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = formToPayload(e.target);
  const isEdit = {{ 'true' if declaration else 'false' }};
  const url = isEdit ? '/api/declarations/{{ declaration.id if declaration else 0 }}' : '/api/declarations';
  const data = await api(url, {method: isEdit ? 'PUT' : 'POST', body: JSON.stringify(payload)});
  if (!data.ok) { alert(data.error || 'خطا در ذخیره کوتاژ'); return; }
  alert('کوتاژ ذخیره شد. مانده تناژ به‌روز شد.');
  location.href = '/contracts/' + data.item.contract_id;
});
loadContracts();
</script>
{% endblock %}
